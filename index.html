<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827"><link rel="manifest" href="./manifest.json"><link rel="apple-touch-icon" href="./icons/icon-192.png">
<title>Russische Aussprache</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#f8fafc;min-height:100vh}.wrap{max-width:720px;margin:auto;padding:28px 18px 48px}h1{font-size:clamp(28px,6vw,44px);margin:0 0 8px}p{color:#cbd5e1;margin:0 0 22px}.grid{display:grid;gap:12px}.card{width:100%;border:1px solid #334155;background:#172033;color:white;border-radius:18px;padding:17px 18px;display:grid;grid-template-columns:1fr auto;align-items:center;text-align:left;cursor:pointer}.card:active{transform:scale(.985);background:#202b40}.ru{font-size:25px;font-weight:750}.de{display:block;font-size:14px;color:#aebbd0;margin-top:4px}.play{font-size:25px;background:#2b3954;border-radius:50%;width:48px;height:48px;display:grid;place-items:center}.status{min-height:24px;color:#93c5fd;margin:12px 0 0;font-size:14px}.note{font-size:12px;color:#94a3b8;margin-top:20px;line-height:1.45}
</style></head>
<body><main class="wrap"><h1>Russische Aussprache</h1><p>Tippe auf einen Button.</p><div id="grid" class="grid"></div><div id="status" class="status"></div><div class="note">Die App verwendet die russische Systemstimme deines Geräts. Für die Installation als PWA muss sie über HTTPS oder localhost geöffnet werden.</div></main>
<script>
const words=[['блядь','Scheiße! / Fuck!'],['сука','Miststück / Bitch'],['хуй','Schwanz (sehr vulgär)'],['пиздец','völlig im Arsch / Katastrophe'],['ебать','ficken'],['мудак','Arschloch / Vollidiot'],['иди на хуй','Verpiss dich / Fick dich'],['пошёл на хуй','Verpiss dich / Fick dich'],['говно','Scheiße'],['чёрт','Verdammt! / Teufel!']];
const grid=document.getElementById('grid'),status=document.getElementById('status');
let voices=[];
function loadVoices(){voices=window.speechSynthesis?window.speechSynthesis.getVoices():[]}
if('speechSynthesis' in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices}
function speak(text){
 if(!('speechSynthesis' in window)){status.textContent='Dieser Browser unterstützt keine Sprachausgabe.';return}
 // Must run synchronously from the tap/click event (important on iOS).
 speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(text);u.lang='ru-RU';u.rate=0.88;u.pitch=1;
 loadVoices();
 const v=voices.find(x=>/^ru-RU$/i.test(x.lang))||voices.find(x=>/^ru\b/i.test(x.lang));
 if(v)u.voice=v;
 u.onstart=()=>status.textContent='▶ '+text;
 u.onend=()=>status.textContent='';
 u.onerror=e=>status.textContent='Sprachausgabe fehlgeschlagen. Prüfe, ob eine russische Stimme auf dem Gerät installiert ist.';
 speechSynthesis.speak(u);
}
words.forEach(([ru,de])=>{const b=document.createElement('button');b.type='button';b.className='card';const left=document.createElement('span');const r=document.createElement('span');r.className='ru';r.textContent=ru;const d=document.createElement('span');d.className='de';d.textContent=de;left.append(r,d);const play=document.createElement('span');play.className='play';play.textContent='▶';play.setAttribute('aria-hidden','true');b.append(left,play);b.addEventListener('click',()=>speak(ru));grid.appendChild(b)});
if('serviceWorker' in navigator && location.protocol!=='file:') window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
