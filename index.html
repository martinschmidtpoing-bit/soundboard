<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101319">
  <title>Multilingual Soundbar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header>
      <p class="eyebrow">SOUNDBAR</p>
      <h1>Schimpfwörter</h1>
      <p class="sub">Sprache wählen und einen Button antippen.</p>
    </header>

    <nav class="tabs" role="tablist" aria-label="Sprachen">
      <button class="tab active" role="tab" aria-selected="true" data-lang="ru">Russisch</button>
      <button class="tab" role="tab" aria-selected="false" data-lang="ar">Arabisch</button>
      <button class="tab" role="tab" aria-selected="false" data-lang="tr">Türkisch</button>
      <button class="tab" role="tab" aria-selected="false" data-lang="sh">Serbokroatisch</button>
    </nav>

    <section class="status">
      <span id="languageTitle">Russisch</span>
      <button id="stopBtn" class="stop" type="button">■ Stop</button>
    </section>

    <section id="soundGrid" class="grid" aria-live="polite"></section>

    <footer>
      Audio wird über die Sprachsynthese des Browsers erzeugt. Die tatsächlich verfügbare Stimme hängt vom Gerät ab.
    </footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
